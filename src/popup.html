<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>State Mover</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="app-header">
        <img class="app-logo" src="../icons/icon-48.png" alt="" width="24" height="24">
        <div class="app-title">
            <h1>State Mover</h1>
            <p id="originLabel" class="app-origin">Reading page&hellip;</p>
        </div>
    </header>

    <div id="pageError" class="banner banner-error" hidden></div>

    <main id="workspace">
        <nav class="tabs" role="tablist">
            <button id="tabLocal" class="tab is-active" role="tab" aria-selected="true" aria-controls="keyList">
                localStorage <span id="localCount" class="tab-count">0</span>
            </button>
            <button id="tabSession" class="tab" role="tab" aria-selected="false" aria-controls="keyList">
                sessionStorage <span id="sessionCount" class="tab-count">0</span>
            </button>
        </nav>

        <div class="toolbar">
            <input id="filterInput" class="filter" type="search" placeholder="Filter keys" autocomplete="off" spellcheck="false">
            <button id="selectAllBtn" class="link-btn" type="button">All</button>
            <button id="selectNoneBtn" class="link-btn" type="button">None</button>
        </div>

        <div id="keyList" class="key-list" role="tabpanel"></div>

        <p id="selectionSummary" class="summary">No keys selected.</p>

        <section class="section">
            <h2>Export</h2>
            <div class="button-row">
                <button id="copyBtn" class="btn btn-primary" type="button">Copy snapshot</button>
                <button id="downloadBtn" class="btn" type="button">Download .json</button>
            </div>
        </section>

        <section class="section">
            <h2>Import</h2>
            <textarea id="importData" placeholder="Paste a State Mover snapshot here, or load a .json file." spellcheck="false"></textarea>
            <label class="checkbox-row">
                <input id="reloadAfterImport" type="checkbox" checked>
                <span>Reload the page after import</span>
            </label>
            <div class="button-row">
                <button id="importBtn" class="btn btn-primary" type="button">Apply snapshot</button>
                <button id="loadFileBtn" class="btn" type="button">Load file&hellip;</button>
                <input id="fileInput" type="file" accept="application/json,.json" hidden>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="popup.js"></script>
</body>
</html>
